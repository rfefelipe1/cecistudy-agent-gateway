# Blueprint do Render (Web Service Free).
#
# Os segredos usam `sync: false`: o valor é preenchido no painel do Render e
# nunca entra no repositório.
services:
  - type: web
    name: cecistudy-agent-gateway
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NIM_MODELS
        value: nvidia/nemotron-3-ultra-550b-a55b,deepseek-ai/deepseek-v4-pro,moonshotai/kimi-k3,z-ai/glm-5-3,openai/gpt-oss-120b
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: NIM_API_KEYS
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GATEWAY_SESSION_SECRET
        sync: false
      - key: AGENT_APP_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
